<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - Uday Girish Maradana</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="blog-config.js"></script>
</head>

<body>
    <!-- Navigation -->
    <nav class="navbar">
        <a href="../index.html?from=blog" class="back-button">
            <span>←</span>
            <span>Back to Wormhole</span>
        </a>
        <div class="nav-brand">Blog</div>
    </nav>

    <!-- Hero -->
    <section class="hero">
        <div class="hero-content">
            <h1 class="hero-title">Thoughts & Explorations</h1>
            <p class="hero-subtitle">AI, Robotics, Quantum Computing & Philosophy</p>
        </div>
    </section>

    <!-- Blog Posts -->
    <main class="container">
        <div class="posts-grid" id="posts-grid">
            <!-- Posts will be dynamically loaded here -->
        </div>
    </main>

    <!-- Blog Post Modal -->
    <div class="modal" id="post-modal">
        <div class="modal-content">
            <button class="modal-close" id="modal-close">&times;</button>
            <article class="post-content" id="post-content">
                <!-- Markdown content will be rendered here -->
            </article>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
