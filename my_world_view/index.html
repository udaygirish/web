<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My World View | Uday Girish Maradana</title>
    <meta name="description" content="3D immersive solar system portfolio — explore my universe">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Landing / Launch Transition Overlay -->
    <div id="landing-overlay" style="position:fixed;top:0;left:0;width:100%;height:100%;background:white;z-index:9999;opacity:0;pointer-events:none;transition:opacity 2s ease;"></div>

    <!-- Canvas -->
    <canvas id="canvas3d"></canvas>

    <!-- HUD Overlay -->
    <div class="hud">
        <!-- Back Button -->
        <button class="back-button" onclick="window.location.href='../index.html?from=my_world_view'">
            &#8592; Return to Navigation
        </button>

        <!-- Title -->
        <div class="title-overlay">
            <h1>My World View</h1>
            <p>Explore my universe</p>
        </div>

        <!-- View Toggle -->
        <div class="view-toggle">
            <button class="toggle-btn active" id="btn3D">3D View</button>
            <button class="toggle-btn" id="btn2D">2D Map</button>
        </div>

        <!-- Controls Hint (orbit mode) -->
        <div class="controls-hint" id="orbit-controls-hint">
            <p><strong>Controls:</strong> WASD &mdash; Move &nbsp;|&nbsp; Mouse &mdash; Look &nbsp;|&nbsp; Click Planet &mdash; View Info</p>
        </div>

        <!-- Current System Info -->
        <div class="system-info" id="systemInfo">
            <span class="system-name" id="systemName">---</span>
        </div>
    </div>

    <!-- Planet Approach HUD (shown when flying close to a planet in orbit mode) -->
    <div id="planet-approach-hud" class="planet-approach-hud"></div>

    <!-- 2D View Planet Labels Container -->
    <div id="labels-2d-container" style="display:none; position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:100;"></div>

    <!-- Rover Surface HUD (shown while on a planet surface) -->
    <div id="rover-hud" class="rover-hud" style="display:none;">
        <div class="rover-hud-item">
            <svg class="rover-compass" viewBox="0 0 40 40">
                <circle cx="20" cy="20" r="18" fill="none" stroke="rgba(0,255,136,0.3)" stroke-width="2"/>
                <text x="20" y="10" fill="#00ff88" font-size="8" font-family="Orbitron" text-anchor="middle">N</text>
                <text x="20" y="36" fill="rgba(0,255,136,0.5)" font-size="6" font-family="Orbitron" text-anchor="middle">S</text>
                <polygon id="compass-needle" points="20,14 24,26 20,24 16,26" fill="#00ff88"/>
            </svg>
        </div>
        <div class="rover-hud-item">
            <span class="rover-hud-label">BIOME</span>
            <span class="rover-hud-value" id="rover-biome">---</span>
        </div>
        <div class="rover-hud-item">
            <span class="rover-hud-label">SPEED</span>
            <span class="rover-hud-value" id="rover-speed">0.00 m/s</span>
        </div>
        <div class="rover-hud-item rover-hud-launch">
            <span class="rover-hud-label">LAUNCH</span>
            <span class="rover-hud-value rover-hud-key">[ E ]</span>
        </div>
        <div class="rover-hud-item">
            <span class="rover-hud-label">DRIVE</span>
            <span class="rover-hud-value" style="font-size:0.7rem;">W / S / A / D</span>
        </div>
        <div class="rover-hud-item" id="interact-hint" style="display:none; background: rgba(0,255,136,0.2);">
            <span class="rover-hud-label">KIOSK</span>
            <span class="rover-hud-value rover-hud-key">[ F ]</span>
        </div>
    </div>

    <!-- Kiosk Modal -->
    <div id="kiosk-modal" class="kiosk-modal" style="display:none;">
        <div class="kiosk-modal-content">
            <button class="close-card-btn" id="closeKioskBtn">&times;</button>
            <h2 id="kiosk-title">Kiosk Title</h2>
            <div id="kiosk-body" class="kiosk-body">
                <p>Loading data...</p>
            </div>
            <a href="#" target="_blank" class="btn btn-primary" id="kiosk-action-btn" style="display:none; margin-top:20px; text-decoration:none;">View Project</a>
        </div>
    </div>

    <!-- Planet Info Card (Floating) -->
    <div class="planet-info-card" id="planetInfoCard">
        <button class="close-card-btn" id="closeCardBtn">&times;</button>
        <div class="card-header">
            <h2 id="cardTitle">Planet Name</h2>
        </div>
        <div class="card-body" id="cardContent">
            <!-- Content will be inserted dynamically -->
        </div>
        <div class="card-footer" style="padding-top:15px; margin-top:10px; border-top:1px solid rgba(0,255,136,0.2);">
            <button id="land-btn" class="land-btn-primary" style="display:none;">INITIATE LANDING</button>
        </div>
    </div>

    <!-- Boundary Warning Overlay -->
    <div id="boundary-warning" style="display:none; position:fixed; top:20%; left:50%; transform:translateX(-50%); text-align:center; z-index:2000; pointer-events:none;">
        <h1 style="color:#ff0033; font-family:'Orbitron', sans-serif; font-size:3rem; text-shadow: 0 0 20px #ff0000; margin:0; animation: flash 1s infinite;">WARNING</h1>
        <p style="color:#ffaaaa; font-family:'Inter', sans-serif; font-size:1.2rem; background:rgba(255,0,0,0.2); padding:10px 20px; border-radius:5px; border:1px solid #ff0033;">LEAVING EXPLORATION ZONE. RETURN TO BASE.</p>
    </div>

    <style>
        @keyframes flash {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="app.js?v=9"></script>
</body>

</html>
